<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Write</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F0; 
  --ink:#1F2421; 
  --mute:#7E8681; 
  --line:#D9DDD8; --accent:#3F6B5B;
  --fold-line:#B6BDB8; --fold-ink:#5F6762;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161A19;--ink:#DCE0DB;--mute:#7C847F;--line:#2A302E;--accent:#8FBBA9;--fold-line:#7C847F;--fold-ink:#7C847F;color-scheme:dark}
}
:root[data-theme="dark"]{
  /* --bg:#161A19; */
  --bg: #04040e;
  --ink:#DCE0DB;--mute:#7C847F;--line:#2A302E;--accent:#8FBBA9;--fold-line:#7C847F;--fold-ink:#7C847F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column;
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
#t{
  flex:1; min-height:0; width:100%; resize:none; border:0; outline:0; background:transparent;
  color:var(--ink); caret-color:var(--accent);
  font-family:Literata,Georgia,"Times New Roman",serif; font-size:1.25rem; line-height:1.75;
  padding:12vh max(1.5rem,calc((100% - 40rem)/2)) 3rem;
}
#t::placeholder{color:var(--mute)}
body.nocaret #t{caret-color:transparent}
#t{scrollbar-width:thin;scrollbar-color:transparent transparent}
#t:hover{scrollbar-color:var(--fold-line) transparent}
#t::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.bar{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.5rem 1.25rem;
  padding:.75rem max(1.25rem,calc((100% - 52rem)/2)); padding-right:max(4.5rem,calc((100% - 52rem)/2));
  font-size:.85rem; color:var(--mute); border-top:1px solid var(--line);
  transition:opacity .6s ease;
}
body.typing .dock{opacity:.18}
.dock{position:relative;display:flex;flex-direction:column;transition:opacity .6s ease}
body.folded.typing .dock{opacity:.4}
.mini{display:none;position:absolute;right:4rem;bottom:10px;height:38px;padding:0 .75rem;align-items:center;gap:1rem;border-radius:100px;background:var(--bg);font-size:.85rem;color:var(--mute);font-variant-numeric:tabular-nums;pointer-events:none}
body.folded .mini{display:flex}
.mini .done{color:var(--accent)}
.fold{position:absolute;right:0;bottom:10px;z-index:2;padding:10px 1.1rem;border-radius:100px;background:var(--bg);border:1px solid var(--fold-line);color:var(--fold-ink)}
.fold svg,#theme svg{display:block}
.fold svg{transition:transform .2s ease}
body.folded .fold svg{transform:rotate(180deg)}
body.folded .bar{display:none}
#theme{padding:.3rem .45rem}
#cmin{width:3.4rem;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--mute);border-radius:0;text-align:center;padding:.25rem 0;outline:0;-moz-appearance:textfield;appearance:textfield}
#cmin::placeholder{color:var(--mute)}
#cmin:focus{border-color:var(--accent)}
#cmin::-webkit-inner-spin-button,#cmin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.group{display:flex; align-items:center; gap:.25rem}
button{
  font:inherit; color:inherit; background:none; border:0; border-radius:6px;
  padding:.3rem .55rem; cursor:pointer;
}
button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
button[aria-pressed="true"]{color:var(--ink); background:color-mix(in srgb,var(--ink) 8%,transparent)}
.time{
  font-size:1.5rem; font-weight:500; color:var(--ink); min-width:4.6ch; text-align:center;
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.time.done{color:var(--accent)}
#go{color:var(--ink); border:1px solid var(--line); padding:.3rem .9rem}
#go:hover{border-color:var(--mute)}
#chips[hidden]{display:none}
@media (max-width:640px){ .bar{justify-content:center} #t{font-size:1.1rem} }
@media (prefers-reduced-motion:reduce){ .bar,.dock,.fold svg{transition:none} }
</style>
</head>
<body>
<textarea id="t" placeholder="Start writing…" spellcheck="true" autofocus aria-label="Writing area"></textarea>

<div class="dock">
<button id="fold" class="fold" aria-expanded="true" aria-label="Hide toolbar"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button>
<div class="mini" id="mini" aria-hidden="true"><span id="miniTime" hidden></span><span id="miniWords"></span></div>
<footer class="bar" id="bar">
  <div class="group" role="group" aria-label="Timer mode">
    <button id="mDown" aria-pressed="true">Countdown</button>
    <button id="mUp" aria-pressed="false">Count up</button>
    <span id="chips" class="group" role="group" aria-label="Countdown length">
      <button data-min="10" aria-pressed="false">10</button>
      <button data-min="15" aria-pressed="true">15</button>
      <button id="custom" aria-pressed="false">Custom</button>
      <input id="cmin" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="min" aria-label="Custom minutes" hidden>
      
    </span>
  </div>
  <div class="group">
    <span class="time" id="time" role="timer" aria-live="off">25:00</span>
    <button id="go">Start</button>
    <button id="reset">Reset</button>
  </div>
  <div class="group">
    <span id="words">0 words</span>
    <button id="caret" aria-pressed="false" aria-label="Hide the blinking cursor">Hide cursor</button>
    <button id="theme" aria-label="Switch to dark theme"></button>
  </div>
</footer>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var t=$('t'), timeEl=$('time'), go=$('go'), words=$('words'), miniTime=$('miniTime'), miniWords=$('miniWords');
  var store = {
    get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };

  /* ---- writing ---- */
  t.value = store.get('w:text') || '';
  var saveTimer;
  function countWords(){
    var n = (t.value.trim().match(/\S+/g)||[]).length;
    words.textContent = n + (n===1?' word':' words');
    miniWords.textContent = words.textContent;
  }
  t.addEventListener('input', function(){
    countWords();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){store.set('w:text', t.value)}, 400);
  });
  countWords();

  /* fade the bar while typing, bring it back on mouse/touch */
  t.addEventListener('keydown', function(){document.body.classList.add('typing')});
  ['mousemove','pointerdown','touchstart'].forEach(function(ev){
    window.addEventListener(ev, function(){document.body.classList.remove('typing')}, {passive:true});
  });
  $('bar').addEventListener('focusin', function(){document.body.classList.remove('typing')});

  /* ---- timer ---- */
  var mode = store.get('w:mode')==='up' ? 'up' : 'down';
  var mins = parseInt(store.get('w:mins'),10) || 15;
  var elapsed = 0, startedAt = 0, running = false, finished = false, tick;
  var baseTitle = document.title;

  function current(){ return elapsed + (running ? Date.now()-startedAt : 0); }
  function fmt(ms){
    var s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
    var p = function(n){return n<10?'0'+n:''+n};
    return (h ? h+':' : '') + p(m) + ':' + p(x);
  }
  function render(){
    var ms = mode==='down' ? mins*60000 - current() : current();
    if (mode==='down' && ms<=0 && running) return finish();
    var label = fmt(mode==='down' ? Math.ceil(ms/1000)*1000 : ms);
    timeEl.textContent = label;
    miniTime.textContent = label; miniTime.hidden = !running && !finished;
    miniTime.classList.toggle('done', finished);
    timeEl.classList.toggle('done', finished);
    document.title = running ? label + ' · ' + baseTitle : baseTitle;
  }
  function start(){
    if (finished) reset();
    running = true; startedAt = Date.now();
    clearInterval(tick); tick = setInterval(render, 250);
    go.textContent = 'Pause'; render();
  }
  function pause(){
    elapsed = current(); running = false; clearInterval(tick);
    go.textContent = 'Start'; render();
  }
  function reset(){
    running = false; finished = false; elapsed = 0; clearInterval(tick);
    go.textContent = 'Start'; render();
  }
  function finish(){
    running = false; finished = true; clearInterval(tick); elapsed = mins*60000;
    timeEl.textContent = '00:00'; timeEl.classList.add('done');
    miniTime.textContent = '00:00'; miniTime.hidden = false; miniTime.classList.add('done');
    go.textContent = 'Start'; document.title = 'Time’s up · ' + baseTitle;
    document.body.classList.remove('typing');
    chime();
  }
  function chime(){
    try{
      var C = window.AudioContext || window.webkitAudioContext, a = new C();
      [660, 880].forEach(function(f,i){
        var o = a.createOscillator(), g = a.createGain(), at = a.currentTime + i*0.28;
        o.frequency.value = f; o.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.18, at+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, at+0.6);
        o.start(at); o.stop(at+0.65);
      });
    }catch(e){}
  }

  function setMode(m){
    mode = m; store.set('w:mode', m);
    $('mDown').setAttribute('aria-pressed', m==='down');
    $('mUp').setAttribute('aria-pressed', m==='up');
    $('chips').hidden = m!=='down';
    reset();
  }
  function setMins(n){
    mins = n; store.set('w:mins', n); syncCustom();
    document.querySelectorAll('#chips button').forEach(function(b){
      if (!b.dataset.min) return;
      b.setAttribute('aria-pressed', parseInt(b.dataset.min,10)===n);
    });
    reset();
  }

  go.addEventListener('click', function(){ running ? pause() : start(); });
  $('reset').addEventListener('click', reset);
  $('mDown').addEventListener('click', function(){setMode('down')});
  $('mUp').addEventListener('click', function(){setMode('up')});
  document.querySelectorAll('#chips button').forEach(function(b){
    if (!b.dataset.min) return;
    b.addEventListener('click', function(){setMins(parseInt(b.dataset.min,10))});
  });

  /* ---- custom minutes ---- */
  var cmin = $('cmin');
  function syncCustom(){
    var c = mins!==10 && mins!==15;
    $('custom').setAttribute('aria-pressed', c);
    cmin.hidden = !c;
    if (c) cmin.value = mins;
  }
  $('custom').addEventListener('click', function(){
    cmin.hidden = false;
    if (mins===10 || mins===15) cmin.value = '';
    this.setAttribute('aria-pressed', true);
    cmin.focus(); cmin.select();
  });
  cmin.addEventListener('change', function(){
    var n = Math.round(parseFloat(cmin.value));
    if (n >= 1 && n <= 999 && n !== mins) setMins(n);
  });
  cmin.addEventListener('blur', syncCustom);
  cmin.addEventListener('keydown', function(e){
    if (e.key==='Enter') cmin.blur();
    if (e.key==='Escape'){ cmin.value = ''; cmin.blur(); }
  });

  /* ---- toolbar fold ---- */
  var foldBtn = $('fold');
  function setFold(f){
    document.body.classList.toggle('folded', f);
    foldBtn.setAttribute('aria-expanded', !f);
    foldBtn.setAttribute('aria-label', f ? 'Show toolbar' : 'Hide toolbar');
    store.set('w:folded', f ? '1' : '0');
  }
  foldBtn.addEventListener('click', function(){
    setFold(!document.body.classList.contains('folded'));
    t.focus();
  });
  setFold(store.get('w:folded')==='1');

  /* ---- cursor ---- */
  var cb = $('caret');
  function setCaret(hide){
    document.body.classList.toggle('nocaret', hide);
    cb.setAttribute('aria-pressed', hide);
    store.set('w:nocaret', hide ? '1' : '0');
  }
  cb.addEventListener('click', function(){
    setCaret(!document.body.classList.contains('nocaret'));
    t.focus();
  });
  setCaret(store.get('w:nocaret')==='1');

  /* ---- theme ---- */
  var saved = store.get('w:theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  var ICON = function(d){return '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'};
  var MOON = ICON('<path d="M14 8.5A6 6 0 1 1 7.5 2A4.7 4.7 0 0 0 14 8.5z"/>');
  var SUN = ICON('<circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>');
  function themeIcon(){
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var toDark = cur !== 'dark', b = $('theme'), label = toDark ? 'Switch to dark theme' : 'Switch to light theme';
    b.innerHTML = toDark ? MOON : SUN;
    b.setAttribute('aria-label', label); b.title = label;
  }
  themeIcon();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeIcon); }catch(e){}
  $('theme').addEventListener('click', function(){
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    if (!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur==='dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); store.set('w:theme', next); themeIcon();
  });

  /* init */
  setMode(mode); setMins(mins);
  t.focus();
})();
</script>
</body>
</html>
